<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix Search</title>
    <style>
        :root {
            --bg-color: #202124;
            --surface-color: #303134;
            --surface-hover: #3c4043;
            --border-color: #5f6368;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --link-color: #8ab4f8;
            --accent-purple: #c58af9;
            --accent-blue: #8ab4f8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #8ab4f8 0%, #c58af9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--surface-color);
            border: 1px solid transparent;
            border-radius: 24px;
            padding: 4px 6px;
            margin-bottom: 24px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
            transition: background 0.2s, box-shadow 0.2s;
        }

        .search-box:focus-within {
            background: var(--surface-hover);
            border-color: var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 16px;
            padding: 10px 16px;
        }

        .search-button {
            background: var(--accent-blue);
            color: #202124;
            border: none;
            border-radius: 20px;
            padding: 9px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .search-button:hover {
            opacity: 0.9;
        }

        /* AI Overview Google-style Card */
        .ai-overview-card {
            background: #282a2d;
            border: 1px solid #3c4043;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
        }

        .ai-overview-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4285f4, #ea4335, #fbbc05, #34a853);
        }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-purple);
            margin-bottom: 12px;
        }

        .ai-badge svg {
            width: 16px;
            height: 16px;
            fill: var(--accent-purple);
        }

        .ai-summary {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .ai-highlights {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #3c4043;
            padding-top: 12px;
        }

        .ai-highlights li {
            font-size: 13px;
            color: #bdc1c6;
            line-height: 1.5;
            padding-left: 14px;
            position: relative;
        }

        .ai-highlights li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent-blue);
            font-size: 16px;
            top: -2px;
        }

        /* Search Results List */
        .results-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .result-card {
            margin-bottom: 22px;
        }

        .result-link {
            font-size: 18px;
            color: var(--link-color);
            text-decoration: none;
            display: inline-block;
            line-height: 1.3;
        }

        .result-link:hover {
            text-decoration: underline;
        }

        .result-url {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 3px;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .result-snippet {
            font-size: 14px;
            color: #bdc1c6;
            line-height: 1.55;
        }

        .status-message {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-secondary);
            background: var(--surface-color);
            border-radius: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="brand-title">Zenix Search</h1>
            <p class="brand-subtitle">Private and fast edge search engine</p>
        </div>

        <form id="searchForm" class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Search resources, profiles, or ask a question..." 
                autocomplete="off" 
                required
            >
            <button type="submit" class="search-button">Search</button>
        </form>

        <div id="resultsArea"></div>
    </div>

    <script>
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const resultsArea = document.getElementById("resultsArea");

        const BACKEND_URL = "https://my-search-engine.gpallab726.workers.dev";

        searchForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            resultsArea.innerHTML = `
                <div class="status-message">
                    Synthesizing AI Overview & retrieving results...
                </div>
            `;

            try {
                const response = await fetch(`${BACKEND_URL}/?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                renderResults(query, data);
            } catch (error) {
                resultsArea.innerHTML = `
                    <div class="status-message" style="color: #f28b82;">
                        Failed to connect to backend server. Please verify your connection.
                    </div>
                `;
            }
        });

        function renderResults(query, data) {
            resultsArea.innerHTML = "";

            if (!data.results || data.results.length === 0) {
                resultsArea.innerHTML = `
                    <div class="status-message">
                        No results found for "<b>${query}</b>".
                    </div>
                `;
                return;
            }

            let html = "";

            // Render Google-style AI Overview Card
            if (data.aiOverview) {
                html += `
                    <div class="ai-overview-card">
                        <div class="ai-badge">
                            <svg viewBox="0 0 24 24"><path d="M12 2L14.4 7.6L20 10L14.4 12.4L12 18L9.6 12.4L4 10L9.6 7.6L12 2Z"/></svg>
                            ${data.aiOverview.title}
                        </div>
                        <div class="ai-summary">${data.aiOverview.summary}</div>
                        <ul class="ai-highlights">
                            ${data.aiOverview.highlights.map(item => `<li>${item}</li>`).join("")}
                        </ul>
                    </div>
                `;
            }

            // Results Counter
            html += `<div class="results-meta">About ${data.results.length} result(s) for "${query}"</div>`;

            // Regular Results List
            data.results.forEach(item => {
                html += `
                    <div class="result-card">
                        <a href="${item.url}" target="_blank" class="result-link">${item.title}</a>
                        <div class="result-url">${item.url}</div>
                        <p class="result-snippet">${item.snippet}</p>
                    </div>
                `;
            });

            resultsArea.innerHTML = html;
        }
    </script>
</body>
</html>
