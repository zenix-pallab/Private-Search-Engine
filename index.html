<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenixa Search</title>
    <style>
        :root[data-theme="light"] {
            --bg: #ffffff;
            --text-main: #202124;
            --text-sub: #5f6368;
            --search-bg: #ffffff;
            --search-border: #dfe1e5;
            --search-hover-shadow: 0 2px 8px rgba(32,33,36,.18);
            --link-color: #1a0dab;
            --url-color: #202124;
            --snippet-color: #4d5156;
            --ai-card-bg: #f8fafd;
            --ai-card-border: #d2e3fc;
            --ai-gradient-bar: linear-gradient(90deg, #4285f4, #ea4335, #fbbc05, #34a853);
            --theme-btn-bg: #f1f3f4;
            --theme-btn-color: #3c4043;
            --btn-bg: #f8f9fa;
            --btn-border: #f8f9fa;
            --btn-text: #3c4043;
            --chip-bg: #f1f3f4;
            --chip-border: #dadce0;
        }

        :root[data-theme="dark"] {
            --bg: #171717;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --search-bg: #212121;
            --search-border: #383838;
            --search-hover-shadow: 0 4px 14px rgba(0,0,0,.45);
            --link-color: #8ab4f8;
            --url-color: #dadce0;
            --snippet-color: #cbd5e1;
            --ai-card-bg: #232323;
            --ai-card-border: #333333;
            --ai-gradient-bar: linear-gradient(90deg, #8ab4f8, #f28b82, #fdd663, #81c995);
            --theme-btn-bg: #282828;
            --theme-btn-color: #e8eaed;
            --btn-bg: #282828;
            --btn-border: #383838;
            --btn-text: #e8eaed;
            --chip-bg: #242424;
            --chip-border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }

        /* Top Navigation */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 18px 24px;
            gap: 16px;
        }

        .theme-toggle-btn {
            background: var(--theme-btn-bg);
            color: var(--theme-btn-color);
            border: 1px solid var(--search-border);
            border-radius: 20px;
            padding: 7px 15px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            outline: none;
            transition: all 0.2s;
        }

        /* Home Page Layout */
        body.home-layout {
            justify-content: space-between;
        }

        .home-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            padding: 0 16px 60px 16px;
            width: 100%;
        }

        body.results-layout .home-main {
            display: none;
        }

        /* Zenixa Logo Branding */
        .zenixa-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
            user-select: none;
        }

        .zenixa-brand h1 {
            font-size: 68px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #38bdf8 10%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-search-form {
            width: 100%;
            max-width: 600px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--search-bg);
            border: 1.5px solid var(--search-border);
            border-radius: 28px;
            padding: 12px 18px;
            width: 100%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: box-shadow 0.25s, border-color 0.25s;
        }

        .search-box:hover,
        .search-box:focus-within {
            box-shadow: var(--search-hover-shadow);
            border-color: #38bdf8;
        }

        .search-icon-svg {
            width: 20px;
            height: 20px;
            fill: var(--text-sub);
            margin-right: 12px;
            flex-shrink: 0;
        }

        .main-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            color: var(--text-main);
        }

        .home-button-group {
            display: flex;
            gap: 12px;
            margin-top: 26px;
        }

        .home-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--btn-text);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .home-btn:hover {
            border-color: #38bdf8;
            transform: translateY(-1px);
        }

        /* Quick Discovery Chips */
        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
            max-width: 580px;
        }

        .chip {
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            color: var(--text-sub);
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            color: var(--text-main);
            border-color: #38bdf8;
        }

        /* Results Layout */
        .results-top-bar {
            display: none;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--search-border);
            gap: 24px;
            width: 100%;
        }

        body.results-layout .results-top-bar {
            display: flex;
        }

        .mini-brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -1px;
            text-decoration: none;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            user-select: none;
        }

        .results-search-form {
            flex: 1;
            max-width: 680px;
        }

        .results-search-box {
            display: flex;
            align-items: center;
            background: var(--search-bg);
            border: 1px solid var(--search-border);
            border-radius: 24px;
            padding: 8px 16px;
        }

        .results-content {
            display: none;
            width: 100%;
            max-width: 680px;
            padding: 20px 24px 60px 24px;
            margin-left: 0;
        }

        @media (min-width: 820px) {
            .results-content {
                margin-left: 140px;
            }
        }

        body.results-layout .results-content {
            display: block;
        }

        .results-stats {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 22px;
        }

        /* AI Overview Card */
        .ai-overview-card {
            background: var(--ai-card-bg);
            border: 1px solid var(--ai-card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }

        .ai-overview-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--ai-gradient-bar);
        }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 14px;
        }

        .ai-sparkle-icon {
            width: 18px;
            height: 18px;
            fill: #38bdf8;
        }

        .ai-summary {
            font-size: 15px;
            line-height: 1.62;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .ai-highlights-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid var(--search-border);
            padding-top: 14px;
        }

        .ai-highlights-list li {
            font-size: 14px;
            line-height: 1.55;
            color: var(--snippet-color);
            padding-left: 16px;
            position: relative;
        }

        .ai-highlights-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #38bdf8;
            font-size: 18px;
            line-height: 1;
        }

        .ai-highlights-list a {
            color: var(--link-color);
            text-decoration: none;
        }

        .ai-highlights-list a:hover {
            text-decoration: underline;
        }

        /* Result Cards */
        .result-entry {
            margin-bottom: 26px;
        }

        .result-site-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .result-site-name {
            font-size: 14px;
            color: var(--url-color);
            font-weight: 500;
        }

        .result-url {
            font-size: 12px;
            color: var(--text-sub);
            word-break: break-all;
        }

        .result-heading {
            font-size: 20px;
            font-weight: 400;
            line-height: 1.3;
        }

        .result-heading a {
            color: var(--link-color);
            text-decoration: none;
        }

        .result-heading a:hover {
            text-decoration: underline;
        }

        .result-snippet {
            font-size: 14px;
            line-height: 1.58;
            color: var(--snippet-color);
            margin-top: 5px;
        }

        .status-box {
            font-size: 15px;
            color: var(--text-sub);
            padding: 30px 0;
        }
    </style>
</head>
<body class="home-layout">

    <!-- Top Bar with Theme Toggle -->
    <div class="top-nav">
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme">
            <span id="themeIcon">☀️</span>
            <span id="themeLabel">Light Mode</span>
        </button>
    </div>

    <!-- Home Page -->
    <main class="home-main">
        <div class="zenixa-brand">
            <h1>Zenixa</h1>
        </div>

        <form id="homeSearchForm" class="home-search-form">
            <div class="search-box">
                <svg class="search-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="homeSearchInput" class="main-input" placeholder="Search resources or ask a question..." autocomplete="off" required>
            </div>
            <div style="display: flex; justify-content: center;">
                <div class="home-button-group">
                    <button type="submit" class="home-btn">Zenixa Search</button>
                    <button type="button" id="identityBtn" class="home-btn">Who are you?</button>
                </div>
            </div>
        </form>

        <!-- Quick Discovery Suggestions -->
        <div class="quick-chips">
            <span class="chip" onclick="quickQuery('Who is Pallab Ghosh?')">Who is Pallab Ghosh?</span>
            <span class="chip" onclick="quickQuery('zenix-pallab github')">GitHub Repositories</span>
            <span class="chip" onclick="quickQuery('Python Docs')">Python Docs</span>
            <span class="chip" onclick="quickQuery('MDN Web Docs')">MDN Web Docs</span>
        </div>
    </main>

    <!-- Results Top Bar -->
    <header class="results-top-bar">
        <a href="/" id="logoHomeLink" class="mini-brand">Zenixa</a>
        <form id="resultsSearchForm" class="results-search-form">
            <div class="results-search-box">
                <input type="text" id="resultsSearchInput" class="main-input" autocomplete="off" required>
                <svg class="search-icon-svg" style="margin-right: 0;" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </div>
        </form>
    </header>

    <!-- Results Content Section -->
    <section class="results-content" id="resultsContainer"></section>

    <script>
        const BACKEND_URL = "https://my-search-engine.gpallab726.workers.dev";

        // Theme Toggle
        const rootElement = document.documentElement;
        const themeToggleBtn = document.getElementById("themeToggleBtn");
        const themeIcon = document.getElementById("themeIcon");
        const themeLabel = document.getElementById("themeLabel");

        function switchTheme(theme) {
            rootElement.setAttribute("data-theme", theme);
            localStorage.setItem("zenixa_theme", theme);
            if (theme === "light") {
                themeIcon.textContent = "🌙";
                themeLabel.textContent = "Dark Mode";
            } else {
                themeIcon.textContent = "☀️";
                themeLabel.textContent = "Light Mode";
            }
        }

        const savedTheme = localStorage.getItem("zenixa_theme") || "dark";
        switchTheme(savedTheme);

        themeToggleBtn.addEventListener("click", () => {
            const currentTheme = rootElement.getAttribute("data-theme");
            switchTheme(currentTheme === "light" ? "dark" : "light");
        });

        // Search Handlers
        const homeSearchForm = document.getElementById("homeSearchForm");
        const homeSearchInput = document.getElementById("homeSearchInput");
        const resultsSearchForm = document.getElementById("resultsSearchForm");
        const resultsSearchInput = document.getElementById("resultsSearchInput");
        const resultsContainer = document.getElementById("resultsContainer");
        const logoHomeLink = document.getElementById("logoHomeLink");
        const identityBtn = document.getElementById("identityBtn");

        function resetToHome() {
            document.body.className = "home-layout";
            resultsContainer.innerHTML = "";
            homeSearchInput.value = "";
            resultsSearchInput.value = "";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        logoHomeLink.addEventListener("click", (e) => {
            e.preventDefault();
            resetToHome();
        });

        identityBtn.addEventListener("click", () => {
            quickQuery("Who are you?");
        });

        function quickQuery(text) {
            homeSearchInput.value = text;
            executeSearch(text);
        }

        homeSearchForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const query = homeSearchInput.value.trim();
            if (query) executeSearch(query);
        });

        resultsSearchForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const query = resultsSearchInput.value.trim();
            if (query) executeSearch(query);
        });

        async function executeSearch(query) {
            document.body.className = "results-layout";
            resultsSearchInput.value = query;
            homeSearchInput.value = query;

            resultsContainer.innerHTML = `
                <div class="status-box">
                    Synthesizing AI Overview for <b>${query}</b>...
                </div>
            `;

            try {
                const response = await fetch(`${BACKEND_URL}/?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                renderResults(query, data);
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div class="status-box" style="color: #ea4335;">
                        Failed to connect to backend server. Please verify your connection.
                    </div>
                `;
            }
        }

        function renderResults(query, data) {
            resultsContainer.innerHTML = "";

            if (!data.results || data.results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="status-box">
                        Your search - <b>${query}</b> - did not match any documents.
                        <br><br>
                        Suggestions:
                        <ul style="margin-left: 20px; margin-top: 8px; line-height: 1.6;">
                            <li>Make sure that all words are spelled correctly.</li>
                            <li>Try different keywords or query creator identity.</li>
                        </ul>
                    </div>
                `;
                return;
            }

            let html = "";

            if (data.aiOverview) {
                html += `
                    <div class="ai-overview-card">
                        <div class="ai-badge">
                            <svg class="ai-sparkle-icon" viewBox="0 0 24 24">
                                <path d="M12 2L14.4 7.6L20 10L14.4 12.4L12 18L9.6 12.4L4 10L9.6 7.6L12 2Z"/>
                            </svg>
                            AI Overview
                        </div>
                        <div class="ai-summary">${data.aiOverview.summary}</div>
                        <ul class="ai-highlights-list">
                            ${data.aiOverview.highlights.map(item => `<li>${item}</li>`).join("")}
                        </ul>
                    </div>
                `;
            }

            html += `<div class="results-stats">About ${data.results.length} result(s)</div>`;

            data.results.forEach(item => {
                let displayDomain = item.url;
                try {
                    displayDomain = new URL(item.url).hostname;
                } catch(e) {}

                html += `
                    <div class="result-entry">
                        <div class="result-site-row">
                            <span class="result-site-name">${item.author || displayDomain}</span>
                        </div>
                        <div class="result-url">${item.url}</div>
                        <h3 class="result-heading">
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                        </h3>
                        <p class="result-snippet">${item.snippet}</p>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }
    </script>
</body>
</html>
